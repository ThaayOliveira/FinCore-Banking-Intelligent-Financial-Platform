
services:
  postgres:
    image: postgres:18
    container_name: fincore-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: fincore_identity
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}

    ports:
      - "5432:5432"

    volumes:
      - fincore-postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore -d fincore_identity"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fincore-postgres-data:
